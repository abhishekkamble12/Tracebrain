services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      # Host ports come from .env (compose reads it), so they can move off ports another stack uses.
      - "${FALKOR_PORT:-6379}:6379"           # Redis protocol (clients)
      - "${FALKOR_BROWSER_PORT:-3000}:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb-data:
